<section class="chat-panel">
  <div class="chat-panel__messages">
    @for (message of chat.messages(); track message.id) {
      <div class="message" [class.message--user]="message.role === 'user'">
        <strong>{{ message.role === 'user' ? 'You' : 'Assistant' }}:</strong>
        <span>{{ message.content }}</span>
        @if (message.status === 'error') {
          <span class="message__error">Something went wrong.</span>
        }
      </div>
    }
  </div>

  <form class="chat-panel__form" (submit)="$event.preventDefault(); send()">
    <app-input label="Message" placeholder="Ask a question..." [(value)]="draft" />

    @if (chat.status() === 'streaming') {
      <app-button type="button" variant="secondary" (click)="chat.stop()">Stop</app-button>
    } @else if (chat.status() === 'error') {
      <app-button type="button" variant="secondary" (click)="chat.retry()">Retry</app-button>
    } @else {
      <app-button type="submit">Send</app-button>
    }
  </form>
</section>
